app-id: org.aditamento.GeradorEscalasWeb
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: GeradorEscalasWeb
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home
  - --device=dri

modules:
  - name: gerador-escalas
    buildsystem: simple
    build-commands:
      - install -D GeradorEscalasWeb /app/bin/GeradorEscalasWeb
      - install -D org.aditamento.GeradorEscalasWeb.desktop /app/share/applications/org.aditamento.GeradorEscalasWeb.desktop
      - install -D org.aditamento.GeradorEscalasWeb.png /app/share/icons/hicolor/256x256/apps/org.aditamento.GeradorEscalasWeb.png
      - install -D org.aditamento.GeradorEscalasWeb.metainfo.xml /app/share/metainfo/org.aditamento.GeradorEscalasWeb.metainfo.xml
    sources:
      - type: file
        path: ../../GeradorEscalasWeb/build/bin/GeradorEscalasWeb
      - type: file
        path: org.aditamento.GeradorEscalasWeb.desktop
      - type: file
        path: org.aditamento.GeradorEscalasWeb.png
      - type: file
        path: org.aditamento.GeradorEscalasWeb.metainfo.xml
